services:
  - type: web
    name: dexii
    env: node
    plan: free
    buildCommand: npm ci && npm --prefix server ci && npm run build
    startCommand: npm --prefix server start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_MONGO
        value: "true"
      - key: PUBLIC_APP_URL
        value: https://dexii.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Native push (see docs/NATIVE_APP.md). Leave blank to disable.
      - key: APNS_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.dexii.app
      - key: APNS_PRODUCTION
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
