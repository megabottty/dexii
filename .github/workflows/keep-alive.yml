name: Keep Render Service Awake

on:
  schedule:
    # Render's free tier allows 750 instance-hours/month. Pinging every 14
    # minutes around the clock keeps the service awake ~730h, which leaves no
    # headroom and can exhaust the quota (suspending the service).
    # Ping only during realistic waking hours (13:00-05:00 UTC = 7am-11pm MT)
    # so usage stays around ~500h and real visitors still get a warm server.
    - cron: '*/14 13-23 * * *'
    - cron: '*/14 0-4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Dexii Render Service
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL || 'https://dexii.onrender.com' }}
        run: |
          ENDPOINT="${RENDER_APP_URL%/}/api/health"
          echo "Pinging $ENDPOINT at $(date)..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -m 30 "$ENDPOINT" || true)
          echo "$RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Service is awake and healthy (HTTP 200)."
          else
            echo "Warning: Response code was $HTTP_STATUS"
          fi
