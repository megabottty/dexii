<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dexii</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A private space for your crushes and your closest confidantes.">
  <meta name="theme-color" content="#a881af">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dexii">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=2">
  <script>
    // Optional runtime override for hosted environments.
    // Example: window.__DEXII_API_BASE__ = 'https://your-api.example.com/api';
    window.__DEXII_API_BASE__ = window.__DEXII_API_BASE__ || '';
  </script>
  <style>
    /* Cold-start splash. Inlined so it paints immediately, before any bundle
       loads - on a sleeping free-tier host that wait can be ~50s. */
    #dexii-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background-color: #fffafa;
      color: #2b2b2b;
      font-family: Georgia, 'Times New Roman', serif;
      transition: opacity 420ms ease;
    }
    #dexii-splash.dexii-splash-hide { opacity: 0; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      #dexii-splash { background-color: #020617; color: #f8fafc; }
    }
    .dexii-splash-mark {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 300;
      color: #fff;
      background: linear-gradient(135deg, #a881af, #d4af37);
      animation: dexii-splash-pulse 1.9s ease-in-out infinite;
    }
    .dexii-splash-title {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 7px;
      text-transform: uppercase;
    }
    .dexii-splash-note {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      color: #a881af;
      transition: opacity 500ms ease;
    }
    .dexii-splash-note.dexii-splash-note-show { opacity: 1; }
    @keyframes dexii-splash-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 6px 20px rgba(168, 129, 175, 0.25); }
      50% { transform: scale(1.06); box-shadow: 0 10px 28px rgba(212, 175, 55, 0.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dexii-splash-mark { animation: none; }
      #dexii-splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="dexii-splash">
    <div class="dexii-splash-mark">D</div>
    <div class="dexii-splash-title">Dexii</div>
    <div class="dexii-splash-note" id="dexii-splash-note">Warming up the kettle…</div>
  </div>
  <app-root></app-root>
  <script>
    (function () {
      var splash = document.getElementById('dexii-splash');
      var note = document.getElementById('dexii-splash-note');
      if (!splash) return;

      // Only mention the wait if boot is genuinely slow, so fast loads stay clean.
      var slowTimer = setTimeout(function () {
        if (note) note.className = 'dexii-splash-note dexii-splash-note-show';
      }, 2500);

      function dismiss() {
        clearTimeout(slowTimer);
        if (!splash || splash.classList.contains('dexii-splash-hide')) return;
        splash.classList.add('dexii-splash-hide');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 500);
      }

      // Hide as soon as Angular has rendered something into <app-root>.
      var root = document.querySelector('app-root');
      if (root && window.MutationObserver) {
        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            observer.disconnect();
            dismiss();
          }
        });
        observer.observe(root, { childList: true, subtree: true });
      }

      // Safety net so the splash can never get stuck.
      setTimeout(dismiss, 15000);
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (root && root.childNodes.length > 0) dismiss();
        }, 300);
      });
    })();
  </script>
</body>
</html>
